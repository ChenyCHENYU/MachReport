<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="MachReport">
  <defs>
    <linearGradient id="mr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5fb8"/>
      <stop offset="1" stop-color="#1f4a99"/>
    </linearGradient>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 文档主体 -->
    <g transform="translate(18,28)">
      <path d="M10 6 h52 l20 20 v74 a6 6 0 0 1 -6 6 H10 a6 6 0 0 1 -6 -6 V12 a6 6 0 0 1 6 -6 z" fill="#ffffff" stroke="#24292f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M62 6 l20 20 h-20 z" fill="#d0d7de"/>
      <!-- 标题条 -->
      <rect x="16" y="34" width="34" height="5" rx="2.5" fill="url(#mr-accent)"/>
      <!-- 表格网格 -->
      <g stroke="#24292f" stroke-width="2" fill="none">
        <rect x="16" y="48" width="56" height="36" rx="2"/>
        <line x1="16" y1="60" x2="72" y2="60"/>
        <line x1="16" y1="72" x2="72" y2="72"/>
        <line x1="38" y1="48" x2="38" y2="84"/>
        <line x1="58" y1="48" x2="58" y2="84"/>
      </g>
      <rect x="18" y="50" width="18" height="8" fill="#2d5fb8" opacity="0.85"/>
      <!-- 分页点 -->
      <circle cx="44" cy="96" r="2.6" fill="#2d5fb8"/>
      <circle cx="54" cy="96" r="2.6" fill="#d0d7de"/>
      <circle cx="64" cy="96" r="2.6" fill="#d0d7de"/>
    </g>
    <!-- 文字 -->
    <text x="132" y="86" font-size="54" font-weight="700" letter-spacing="-1">
      <tspan fill="#2d5fb8">Mach</tspan><tspan fill="#24292f">Report</tspan>
    </text>
    <text x="134" y="116" font-size="15" fill="#57606a" letter-spacing="1.5">B 端打印报表引擎 · 单真相源渲染 · 虚拟化预览 / PDF 直出 / Excel / 打印</text>
    <!-- 管线三出口 -->
    <g transform="translate(608,44)" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 屏幕 -->
      <rect x="0" y="0" width="26" height="18" rx="3"/>
      <path d="M9 22 h8 M13 18 v4"/>
      <!-- 箭头 -->
      <path d="M34 9 h7 m-3 -3 l3 3 l-3 3" stroke="#2d5fb8"/>
      <!-- 文档/PDF -->
      <g transform="translate(46,0)">
        <path d="M4 0 h13 l7 7 v15 h-20 z"/>
        <path d="M17 0 v7 h7" fill="none"/>
      </g>
      <!-- 箭头 -->
      <path d="M72 9 h7 m-3 -3 l3 3 l-3 3" stroke="#2d5fb8"/>
      <!-- 打印机 -->
      <g transform="translate(84,0)">
        <rect x="3" y="8" width="20" height="12" rx="2"/>
        <path d="M7 8 v-5 h12 v5"/>
        <rect x="9" y="13" width="8" height="4" fill="#2d5fb8" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
