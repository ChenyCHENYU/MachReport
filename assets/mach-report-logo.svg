<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">MachReport</title>
  <desc id="desc">MachReport paginated report engine. A gradient M on layered report pages, detail rows, and page markers.</desc>
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071027"/>
      <stop offset=".58" stop-color="#0A1635"/>
      <stop offset="1" stop-color="#101A40"/>
    </linearGradient>
    <linearGradient id="surface" x1="40" y1="22" x2="248" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C44"/>
      <stop offset="1" stop-color="#071027"/>
    </linearGradient>
    <linearGradient id="signal" x1="89" y1="88" x2="182" y2="193" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D9FF"/>
      <stop offset=".5" stop-color="#4D8DFF"/>
      <stop offset="1" stop-color="#8B5CFF"/>
    </linearGradient>
    <linearGradient id="word" x1="296" y1="72" x2="990" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#AFC4F8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1120" height="280" rx="38" fill="url(#banner)"/>
  <circle cx="1010" cy="-18" r="210" fill="#356DFF" opacity=".08"/>
  <circle cx="760" cy="320" r="230" fill="#18D4FF" opacity=".035"/>
  <g fill="none" stroke="#617BB6" stroke-opacity=".10" stroke-width="2">
    <path d="M1042 63h39v103h-39zM1030 77h39v103h-39zM1018 91h39v103h-39z"/>
    <path d="M1027 146h20m-20 12h20m-20 12h12"/>
  </g>

  <rect x="24" y="20" width="240" height="240" rx="62" fill="url(#surface)" filter="url(#shadow)"/>
  <path d="M51 104h17M45 135h23M51 166h17" stroke="#46CFFF" stroke-linecap="round" stroke-width="6" opacity=".28"/>
  <path d="M113 51h78l25 25v130a10 10 0 0 1-10 10h-93a10 10 0 0 1-10-10V61a10 10 0 0 1 10-10z" fill="#121E46" stroke="#627DC0" stroke-opacity=".38" stroke-width="2"/>
  <path d="M97 62h78l25 25v130a10 10 0 0 1-10 10H97a10 10 0 0 1-10-10V72a10 10 0 0 1 10-10z" fill="#111C3E" stroke="#88A5E4" stroke-opacity=".42" stroke-width="2"/>
  <path d="M82 73h78l25 25v130a10 10 0 0 1-10 10H82a10 10 0 0 1-10-10V83a10 10 0 0 1 10-10z" fill="#0E1939" stroke="#99CFFF" stroke-opacity=".6" stroke-width="2"/>
  <path d="M160 73v15a10 10 0 0 0 10 10h15" fill="#173363" stroke="#99CFFF" stroke-opacity=".6" stroke-width="2"/>
  <path d="M91 151v-43l26 33 26-33v43" fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M87 170h83" stroke="#52CFF5" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <g stroke="#99AEE4" stroke-opacity=".4" stroke-width="2">
    <path d="M87 185h83M87 197h83M87 209h83M111 177v32M148 177v32"/>
  </g>
  <rect x="147" y="217" width="22" height="6" rx="3" fill="#8B77EF" opacity=".8"/>
  <g fill="#95AEDC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <rect x="210" y="94" width="26" height="23" rx="6" fill="#16264C"/>
    <text x="223" y="110">01</text>
    <rect x="210" y="126" width="26" height="23" rx="6" fill="#1D315D"/>
    <text x="223" y="142">02</text>
    <rect x="210" y="158" width="26" height="23" rx="6" fill="#254375"/>
    <text x="223" y="174" fill="#8BE3FF">03</text>
  </g>

  <text x="310" y="150" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="94" font-weight="760" letter-spacing="-4">MachReport</text>
  <rect x="316" y="177" width="88" height="6" rx="3" fill="#37D6FF"/>
  <rect x="414" y="177" width="56" height="6" rx="3" fill="#4B8DFF"/>
  <rect x="480" y="177" width="34" height="6" rx="3" fill="#855FFF"/>
  <text x="316" y="220" fill="#7185B6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="650" letter-spacing="3.4">PAGINATED REPORT ENGINE</text>
</svg>
