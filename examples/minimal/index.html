<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MachReport Demo</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", sans-serif; }
      #app { height: 100vh; display: flex; }
      .side { width: 210px; background: #1e2126; color: #cfd3d8; padding: 16px 12px; box-sizing: border-box; flex: none; }
      .side h3 { margin: 0 0 10px; font-size: 14px; color: #fff; }
      .side button { display: block; width: 100%; margin-bottom: 8px; padding: 6px 10px; background: #2b3038; color: #e8e8e8; border: 1px solid #3a4048; border-radius: 4px; cursor: pointer; font-size: 12px; text-align: left; }
      .side button:hover { background: #343b45; }
      .side .info { font-size: 11px; color: #7f8790; margin-top: 14px; line-height: 1.6; }
      .main { flex: 1; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
